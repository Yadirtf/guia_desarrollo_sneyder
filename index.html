<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Guía Matemáticas 11°</title>
  <meta name="description" content="Guía interactiva para preparar el examen de Matemáticas 11°: fracciones, decimales, potencias, radicales, intervalos, inecuaciones, conteo y probabilidad." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar glass">
    <a class="brand" href="#/">
      <span class="brand-logo">📐</span>
      <span class="name">Mate 11°<small>Plan de apoyo · Período I</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <button class="icon-btn" id="voiceBtn" title="Voz del profe" aria-label="Ajustes de voz">🔊</button>
  </header>

  <div class="settings glass" id="settings" role="dialog" aria-label="Ajustes de voz">
    <h3>🎙️ Voz del profe</h3>
    <div class="row"><span>Leer cada paso automáticamente</span>
      <label class="toggle"><input type="checkbox" id="autoVoice" /><span class="sw"></span></label></div>
    <div class="row"><span>Velocidad</span><input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1" /></div>
    <div class="row" style="display:block"><span>Voz</span><select class="select" id="voiceSel" style="margin-top:6px"></select></div>
    <div class="row"><button class="btn small" id="testVoice">▶ Probar voz</button><span class="muted" id="voiceInfo" style="font-size:12.5px"></span></div>
  </div>

  <main id="app"></main>

  <div class="voice-dock glass" id="dock">
    <div class="wave"><i></i><i></i><i></i><i></i></div>
    <span class="txt" id="dockTxt">El profe está hablando…</span>
    <button class="icon-btn" id="dockStop" title="Detener" aria-label="Detener voz">⏹</button>
  </div>
  <div class="toast glass" id="toast"></div>
  <canvas class="confetti" id="confetti"></canvas>

  <footer>Hecho con 💙 para que este examen salga increíble · Basado en el Plan de Apoyo de Matemáticas 11° (I. E. Guillermo Valencia)</footer>

  <script src="assets/vendor/katex/katex.min.js"></script>
  <script src="assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/boards.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
